[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["inference: real YOLO inference (opt in with VOR_RUN_INFERENCE_TEST=1)"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "frontend", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
